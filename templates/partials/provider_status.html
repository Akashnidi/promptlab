<div class="flex flex-wrap gap-2 text-xs">
  {% for p in providers %}
  <span class="inline-flex items-center gap-1.5 rounded px-2.5 py-1 border font-medium {% if p.has_key %}border-emerald-300 bg-emerald-50 text-emerald-800 dark:border-emerald-800 dark:bg-emerald-950/40 dark:text-emerald-300{% else %}border-slate-200 bg-slate-100 text-slate-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-400{% endif %}">
    <span class="h-1.5 w-1.5 rounded-full {% if p.has_key %}bg-emerald-500 animate-pulse{% else %}bg-slate-400{% endif %}"></span>
    <span class="uppercase tracking-wider font-bold text-[11px]">{{ p.name }}</span>
    <span class="text-[10px] opacity-75 font-mono">({{ p.models_count }})</span>
  </span>
  {% endfor %}
</div>
