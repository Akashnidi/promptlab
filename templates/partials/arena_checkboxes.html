{% for model in arena_models %}
<label class="arena-model-option flex items-start gap-2.5 p-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/60 hover:border-[#0052cc] cursor-pointer select-none transition-all shadow-2xs">
  <input
    type="checkbox"
    name="models"
    value="{{ model.id }}"
    onchange="handleArenaModelChange(this)"
    class="mt-0.5 rounded text-[#0052cc] focus:ring-[#0052cc] h-4 w-4"
  />
  <div class="min-w-0 flex-1">
    <div class="flex items-center justify-between">
      <span class="text-xs font-bold text-slate-900 dark:text-slate-100 font-mono">{{ model.label }}</span>
      <span class="lozenge {% if 'Fast' in model.badge or 'FAST' in model.badge %}lozenge-green{% elif 'Reasoning' in model.badge or 'REASONING' in model.badge %}lozenge-purple{% elif 'General' in model.badge or 'GENERAL' in model.badge %}lozenge-blue{% else %}lozenge-amber{% endif %}">
        {{ model.badge }}
      </span>
    </div>
    <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">{{ model.description }}</p>
  </div>
</label>
{% endfor %}
