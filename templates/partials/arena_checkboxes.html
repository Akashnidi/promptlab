{% for model in arena_models %}
<label class="arena-model-option flex items-start gap-3 p-3 rounded-lg border border-slate-800 bg-slate-900/60 hover:bg-slate-900 hover:border-slate-700 cursor-pointer select-none transition-all">
  <input
    type="checkbox"
    name="models"
    value="{{ model.id }}"
    onchange="handleArenaModelChange(this)"
    class="mt-0.5 rounded border-slate-700 bg-slate-950 text-indigo-600 focus:ring-indigo-500 h-4 w-4"
  />
  <div class="min-w-0 flex-1">
    <div class="flex items-center justify-between">
      <span class="text-xs font-bold text-slate-200 font-mono">{{ model.label }}</span>
      <span class="text-[10px] uppercase font-mono px-1.5 py-0.2 rounded {{ model.badge_class }}">
        {{ model.badge }}
      </span>
    </div>
    <p class="text-[11px] text-slate-400 mt-0.5">{{ model.description }}</p>
  </div>
</label>
{% endfor %}
