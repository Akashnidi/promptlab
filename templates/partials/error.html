<div
  class="error-banner mb-4 flex items-start justify-between gap-3 rounded-lg border border-red-300 dark:border-red-800 bg-red-50 dark:bg-red-950/60 p-4 text-sm text-red-900 dark:text-red-200 shadow-sm transition-all animate-fade-in"
  id="error-banner-{{ error_id or timestamp or 'alert' }}"
>
  <div class="flex items-start gap-3">
    <span class="text-base leading-none shrink-0">⚠️</span>
    <div>
      <h4 class="font-bold text-xs uppercase tracking-wider text-red-800 dark:text-red-200">Execution Error</h4>
      <p class="mt-1 text-xs text-red-700 dark:text-red-300 leading-relaxed font-mono whitespace-pre-wrap">{{ error_message }}</p>
    </div>
  </div>
  <button
    type="button"
    onclick="this.closest('.error-banner').remove()"
    class="text-red-500 hover:text-red-800 dark:hover:text-white text-xs font-bold p-1 rounded hover:bg-red-100 dark:hover:bg-red-900/50 transition-colors shrink-0"
    title="Dismiss"
  >
    ✕
  </button>
</div>
<script>
  (function() {
    const elId = 'error-banner-{{ error_id or timestamp or "alert" }}';
    setTimeout(function() {
      const banner = document.getElementById(elId);
      if (banner) {
        banner.style.opacity = '0';
        banner.style.transition = 'opacity 0.4s ease';
        setTimeout(function() { if (banner) banner.remove(); }, 400);
      }
    }, 6000);
  })();
</script>
