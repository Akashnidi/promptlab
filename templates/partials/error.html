<div
  class="error-banner mb-4 flex items-start justify-between gap-3 rounded-xl border border-red-500/30 bg-red-950/70 p-4 text-sm text-red-200 shadow-xl shadow-red-950/40 backdrop-blur-sm transition-all animate-fade-in"
  id="error-banner-{{ error_id or timestamp or 'alert' }}"
>
  <div class="flex items-start gap-2.5">
    <span class="text-base leading-none">⚠️</span>
    <div>
      <h4 class="font-semibold text-red-100 text-xs uppercase tracking-wider">Execution Error</h4>
      <p class="mt-1 text-xs text-red-300 leading-relaxed font-mono whitespace-pre-wrap">{{ error_message }}</p>
    </div>
  </div>
  <button
    type="button"
    onclick="this.closest('.error-banner').remove()"
    class="text-red-400 hover:text-red-100 text-xs font-bold px-2 py-1 rounded-md hover:bg-red-900/50 transition-colors shrink-0"
    title="Dismiss"
  >
    ✕
  </button>
</div>
<script>
  (function() {
    const elId = 'error-banner-{{ error_id or timestamp or "alert" }}';
    setTimeout(function() {
      const banner = document.getElementById(elId);
      if (banner) {
        banner.style.opacity = '0';
        banner.style.transition = 'opacity 0.5s ease';
        setTimeout(function() { if (banner) banner.remove(); }, 500);
      }
    }, 5000);
  })();
</script>
