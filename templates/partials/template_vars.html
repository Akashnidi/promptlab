{% if variables %}
<div class="rounded-lg border border-blue-200 dark:border-blue-900 bg-blue-50/60 dark:bg-blue-950/30 p-4 space-y-3 animate-fade-in">
  <div class="flex items-center justify-between pb-2 border-b border-blue-200/60 dark:border-blue-900/60">
    <span class="text-xs font-bold uppercase tracking-wider text-[#0052cc] dark:text-[#579dff] flex items-center gap-1.5">
      <span>🧩</span>
      <span>Detected Template Variables ({{ variables|length }})</span>
    </span>
    <span class="text-[11px] text-slate-500 dark:text-slate-400 font-mono">Interpolated via Jinja2</span>
  </div>

  <div class="grid gap-3 sm:grid-cols-2">
    {% for var in variables %}
    <div class="flex flex-col gap-1">
      <label for="var_{{ var }}" class="text-xs font-bold text-slate-700 dark:text-slate-300 flex items-center gap-1 font-mono">
        <span class="lozenge lozenge-blue">🏷️ {{ var }}</span>
      </label>
      <input
        type="text"
        id="var_{{ var }}"
        name="var_{{ var }}"
        placeholder="Enter value for {{ var }}..."
        class="w-full atlassian-input px-3 py-1.5 text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 font-mono"
      />
    </div>
    {% endfor %}
  </div>
</div>
{% else %}
<div class="rounded-lg border border-dashed border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/20 p-3 text-center">
  <p class="text-xs text-slate-500 dark:text-slate-400">
    💡 Add <code class="rounded bg-slate-200/80 dark:bg-slate-700 px-1.5 py-0.5 text-[#0052cc] dark:text-[#579dff] font-mono">{% raw %}{{variable_name}}{% endraw %}</code> to your prompt to generate dynamic variable fields.
  </p>
</div>
{% endif %}
