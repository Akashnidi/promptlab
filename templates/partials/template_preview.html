<div class="rounded-xl border border-sky-500/30 bg-sky-950/20 p-4 space-y-2 animate-fade-in text-left shadow-lg backdrop-blur-sm">
  <div class="flex items-center justify-between pb-1 border-b border-sky-500/20">
    <div class="flex items-center gap-2">
      <span class="text-xs font-semibold text-sky-300 uppercase tracking-wider flex items-center gap-1.5">
        <span>🔎</span>
        <span>Rendered Prompt Preview</span>
      </span>
      <span class="text-[10px] text-sky-400/80 bg-sky-500/10 px-2 py-0.5 rounded-full border border-sky-500/20">
        AI Payload
      </span>
    </div>

    <div class="flex items-center gap-2">
      <button
        type="button"
        onclick="navigator.clipboard.writeText(document.getElementById('rendered-preview-content').innerText); this.innerText='Copied!'; setTimeout(()=>this.innerText='Copy', 1500);"
        class="text-[11px] text-sky-400 hover:text-sky-200 transition-colors"
      >
        Copy
      </button>
      <button
        type="button"
        onclick="this.closest('.animate-fade-in').remove()"
        class="text-slate-400 hover:text-white text-xs font-bold px-1 transition-colors"
        title="Hide Preview"
      >
        ✕
      </button>
    </div>
  </div>

  <div
    id="rendered-preview-content"
    class="rounded-lg border border-slate-800 bg-slate-950/80 p-3.5 text-xs text-slate-100 font-mono whitespace-pre-wrap leading-relaxed max-h-72 overflow-y-auto"
  >{{ rendered_text }}</div>
</div>
