<div class="rounded-lg border border-blue-200 dark:border-blue-900 bg-white dark:bg-slate-900 p-4 space-y-2.5 animate-fade-in text-left shadow-sm">
  <div class="flex items-center justify-between pb-2 border-b border-slate-200 dark:border-slate-800">
    <div class="flex items-center gap-2">
      <span class="text-xs font-bold text-[#0052cc] dark:text-[#579dff] uppercase tracking-wider flex items-center gap-1.5">
        <span>🔎</span>
        <span>Rendered Prompt Preview</span>
      </span>
      <span class="lozenge lozenge-blue">Payload</span>
    </div>

    <div class="flex items-center gap-2">
      <button
        type="button"
        onclick="copyToClipboard(document.getElementById('rendered-preview-content').innerText)"
        class="btn-atlassian-secondary text-[11px] py-0.5 px-2"
      >
        Copy
      </button>
      <button
        type="button"
        onclick="this.closest('.animate-fade-in').remove()"
        class="text-slate-400 hover:text-slate-700 dark:hover:text-white text-xs font-bold px-1 transition-colors"
        title="Hide Preview"
      >
        ✕
      </button>
    </div>
  </div>

  <div
    id="rendered-preview-content"
    class="rounded-md border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/60 p-3 text-xs text-slate-800 dark:text-slate-200 font-mono whitespace-pre-wrap leading-relaxed max-h-72 overflow-y-auto"
  >{{ rendered_text }}</div>
</div>
